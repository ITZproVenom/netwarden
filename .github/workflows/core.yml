name: Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/netwarden-gui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/netwarden-gui/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: cmd/netwarden-gui/frontend/dist
          if-no-files-found: error
          retention-days: 1

  test:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: cmd/netwarden-gui/frontend/dist
      - name: Install libpcap headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
  race-and-format:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: cmd/netwarden-gui/frontend/dist
      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Race tests
        run: go test -race ./...
