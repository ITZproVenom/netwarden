name: NetWarden
options:
  bundleIdPrefix: com.netwarden
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  NetWarden:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NetWarden
    info:
      path: NetWarden/Info.plist
      properties:
        CFBundleDisplayName: NetWarden
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: NetWarden browses services advertised on your local network (mDNS/Bonjour) so you can see what is reachable from this iPhone. iPhone apps cannot run the raw-packet network scans available in the NetWarden desktop app.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: NetWarden/NetWarden.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netwarden.app
        PRODUCT_NAME: NetWarden
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  NetWarden:
    build:
      targets:
        NetWarden: all
      parallelizeBuild: true
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release