name: NetWarden
options:
  bundleIdPrefix: com.netwarden
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  NetWarden:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NetWarden
    info:
      path: NetWarden/Info.plist
      properties:
        CFBundleDisplayName: NetWarden
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: NetWarden inspects your local network so you can see which devices are reachable from this iPhone. It reads the system neighbor (ARP) cache, sweeps the local subnet, and browses mDNS/Bonjour services. iPhone apps cannot run the raw-packet capture, ARP/NDP redirection, or traffic shaping of the NetWarden desktop app.
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
          - _printer._tcp
          - _ipp._tcp
          - _scanner._tcp
          - _airplay._tcp
          - _raop._tcp
          - _companion-link._tcp
          - _device-info._tcp
          - _workstation._tcp
          - _apple-mobdev2._tcp
          - _googlecast._tcp
          - _homekit._tcp
          - _hap._tcp
          - _ssh._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _rfb._tcp
          - _spotify-connect._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: NetWarden/NetWarden.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netwarden.app
        PRODUCT_NAME: NetWarden
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  NetWarden:
    build:
      targets:
        NetWarden: all
      parallelizeBuild: true
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release